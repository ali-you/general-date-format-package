name: general_date_format
description: "Localized date formatting and parsing for Persian (Jalali), Hebrew, Chinese, Amanta, Saka, and Umm al-Qura (Hijri) dates. Includes Flutter Material localization delegates."
version: 6.0.0
homepage: https://github.com/ali-you
repository: https://github.com/ali-you/general-date-format-package
documentation: https://github.com/ali-you/general-date-format-package
issue_tracker: https://github.com/ali-you/general-date-format-package/issues
topics:
  - date-formatting
  - date-parsing
  - localization
  - calendar
  - date-picker

screenshots:
  - description: "General Date Format logo"
    path: images/general_date_format.png

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  general_date_format_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  general_datetime: ^7.0.0

dev_dependencies:
  general_calendar: '>=1.1.0 <3.0.0'
  general_datetime_core: ^5.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
