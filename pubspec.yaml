name: general_date_format
description: "Localized Persian, Hebrew and Umm al-Qura date formatting, strict/loose parsing, and translated Flutter Material calendar localizations."
version: 3.0.0
homepage: https://github.com/ali-you
repository: https://github.com/ali-you/general-date-format-package
documentation: https://github.com/ali-you/general-date-format-package
issue_tracker: https://github.com/ali-you/general-date-format-package/issues
topics:
  - date
  - time
  - format
  - utils
  - service

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  general_date_format_core: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  general_datetime: ^4.0.0

dev_dependencies:
  general_datetime_core: ^2.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
