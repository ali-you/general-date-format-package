name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Tehran, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package and example
        run: flutter analyze

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - name: Run tests
        run: flutter test

      - name: Run example tests
        working-directory: example
        run: flutter test
