version: 3.2.0
repository: https://github.com/ali-you/general-date-format-package

topics:
  - date-formatting
  - date-parsing
  - localization
  - calendar
  - datetime

environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  general_datetime_core: ^3.1.0
dev_dependencies:
  test: ^1.25.2
  lints: '>=4.0.0 <6.0.0'
